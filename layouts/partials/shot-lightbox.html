{{- /* Workflow shots open at their real size (2026-09-28): the overlay scrolls when an image is wider or taller than the screen, so node labels stay readable on phones; margin:auto centres images that fit. */ -}}
<div id="shot-lightbox" onclick="closeShotLightbox()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:999999;cursor:zoom-out;padding:24px;box-sizing:border-box;overflow:auto;">
<button type="button" onclick="closeShotLightbox()" aria-label="Close" style="position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:9999px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.35);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1000000;">✕</button>
<img id="shot-lightbox-img" class="nozoom" src="" alt="" onclick="closeShotLightbox()" style="max-width:none;max-height:none;margin:auto;border-radius:8px;display:block;cursor:zoom-out;">
</div>
<script>
function openShotLightbox(src, alt) {
  document.getElementById('shot-lightbox-img').src = src;
  document.getElementById('shot-lightbox-img').alt = alt;
  document.getElementById('shot-lightbox').style.display = 'flex';
}
function closeShotLightbox() {
  document.getElementById('shot-lightbox').style.display = 'none';
}
document.addEventListener('keyup', function(e) { if (e.key === 'Escape') closeShotLightbox(); });
</script>
