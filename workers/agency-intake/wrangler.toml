# Cloudflare Worker for the /agencies/ intro-call form. Deploy: npx wrangler deploy
# Secrets are NOT in this file; set them once with:
#   npx wrangler secret put NOTION_TOKEN        (integration shared with the Agency Pipeline database only)
#   npx wrangler secret put TELEGRAM_BOT_TOKEN   (@obeeleads_bot)
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put HEALTH_KEY           (random; GET /health?key=... checks Notion + Telegram access)
name = "agency-intake"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
NOTION_DATA_SOURCE_ID = "763d801b-7ddd-4012-9a77-d2977b97ff32"
FORMSPREE_URL = "https://formspree.io/f/mjglnqqv"
THANKS_URL = "https://www.obedfavour.com/agencies/thanks/"
ALLOWED_ORIGINS = "https://www.obedfavour.com,https://obedfavour.com"

[observability]
enabled = true
